<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>E85 Security-Effect Projection Review</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">Independent Artifact Review</p>
      <h1>E85 Security-Effect Projections</h1>
    </div>
    <div id="progress" class="progress">Loading...</div>
  </header>
  <main>
    <aside>
      <label for="search">Filter tools</label>
      <input id="search" type="search" placeholder="suite or tool name">
      <div id="filters" class="filters">
        <button data-filter="all" class="active">All</button>
        <button data-filter="unreviewed">Unreviewed</button>
        <button data-filter="in_progress">In progress</button>
        <button data-filter="approved">Approved</button>
        <button data-filter="rejected">Rejected</button>
      </div>
      <nav id="tool-list"></nav>
    </aside>
    <section id="review-pane">
      <div class="empty">Select a tool instance.</div>
    </section>
  </main>
  <div id="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
