# Real tool → causal effect mapping rules
# Maps Hermes registered tools to possible causal effects based on tool behavior and arguments

terminal:
  possible_effects:
    - command_executed
    - file_written
    - file_deleted
    - file_content_read
    - network_egress
    - content_fetched
    - message_sent
    - tool_error
  arg_rules:
    command:
      read_patterns: ["cat ", "head ", "tail ", "grep ", "bat ", "less ", "more ", "wc ", "diff ", "file ", "stat ", "ls "]
      write_patterns: [">", ">>", "tee ", "sed -i", "git commit", "git add", "tar -c", "zip ", "gzip "]
      delete_patterns: ["rm ", "rm -rf", "find .* -delete", "shred -u", "unlink "]
      network_patterns: ["curl ", "wget ", "git clone", "git fetch", "git push", "pip install", "ssh ", "scp ", "rsync ", "nmap "]
      message_patterns: ["mail ", "sendmail", "msmtp", "curl.*slack", "curl.*discord", "curl.*webhook"]

read_file:
  possible_effects: [file_content_read, tool_error]

write_file:
  possible_effects: [file_written, tool_error]

patch:
  possible_effects: [file_written, file_deleted, tool_error]

search_files:
  possible_effects: [search_performed, file_content_read, tool_error]

web_search:
  possible_effects: [search_performed, network_egress, tool_error]

web_extract:
  possible_effects: [content_fetched, network_egress, tool_error]

send_message:
  possible_effects: [message_sent, network_egress, tool_error]
  action_rules:
    list: [tool_error]  # listing messages does not send anything
    send: [message_sent, network_egress, tool_error]

delegate_task:
  possible_effects: [subagent_spawned, memory_updated, network_egress, tool_error]

memory:
  possible_effects: [memory_updated, tool_error]
  action_rules:
    add: [memory_updated, tool_error]
    replace: [memory_updated, tool_error]
    remove: [memory_updated, tool_error]

execute_code:
  possible_effects:
    - command_executed
    - file_written
    - file_deleted
    - file_content_read
    - network_egress
    - content_fetched
    - search_performed
    - tool_error

# Abstract tool aliases for our experimental naming
abstract_aliases:
  delete_file:
    real_source: terminal
    note: "Hermes does not register a standalone 'delete_file' tool. File deletion occurs through terminal (rm, find -delete, shred) or through patch operations."
  web_fetch:
    real_source: web_extract
    note: "Our experimental 'web_fetch' maps to Hermes 'web_extract'. The real tool accepts urls array, supports backend selection, URL safety filtering, and LLM summarization."
  delegate:
    real_source: delegate_task
    note: "Our experimental 'delegate' maps to Hermes 'delegate_task'. The real tool includes goal/context/toolsets/tasks/role/acp_command parameters and manages sub-agent isolation."
